<!doctype html>
<html lang="en" class="t-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Ilham Izzul Hadyan</title>
<link rel="icon" type="image/png" href="/assets/logo-ih.png">
<script>(function(){try{var t=localStorage.getItem('theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.className='t-'+t}catch(e){}})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;display=swap">
<style>
body{margin:0}
.t-light{--bg:#F6F8FF;--ink:#0A1140;--muted:#47507A;--btn:#1A3FDB}
.t-dark{--bg:#060A1F;--ink:#EEF2FF;--muted:#A6B0D9;--btn:#2F62F5}
html{background:var(--bg)}
</style>
</head>
<body>
<main style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; text-align: center; color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<img src="/assets/logo-ih.png" alt="IH logo" style="height: 48px; width: auto">
<h1 style="margin: 0; font-size: clamp(32px, 6vw, 56px); letter-spacing: -0.03em">This page took a wrong turn</h1>
<p style="margin: 0; color: var(--muted)">It isn’t here — but the rest of the portfolio is.</p>
<a href="/" style="padding: 14px 22px; border-radius: 14px; background: var(--btn); color: #FFFFFF; text-decoration: none; font-weight: 600">Back to home</a>
</main>
</body>
</html>
